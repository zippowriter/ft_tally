<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>ft_tally ビューアのテスト</title>
<output id="results"></output>
<script type="module">
    const results = {};

    async function openViewer() {
        const frame = document.createElement('iframe');
        frame.src = '../../web/index.html';
        const loaded = new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
        document.body.append(frame);
        await loaded;
        return frame;
    }

    function expect(condition, message) {
        if (!condition) throw new Error(message);
    }

    function setFile(doc, win, file) {
        const transfer = new win.DataTransfer();
        transfer.items.add(file);
        const input = doc.querySelector('#csv-file');
        input.files = transfer.files;
        input.dispatchEvent(new win.Event('change', { bubbles: true }));
    }

    async function waitFor(condition, message) {
        for (let attempt = 0; attempt < 100; attempt += 1) {
            if (condition()) return;
            await new Promise((resolve) => setTimeout(resolve, 10));
        }
        throw new Error(message);
    }

    async function loadCsv(doc, win, csv) {
        setFile(doc, win, new win.File([csv], 'input.csv', { type: 'text/csv' }));
        await waitFor(() => !doc.querySelector('#conditions').disabled, 'CSV の読み込み後に条件が有効になる');
    }

    function tableRows(doc) {
        return Array.from(doc.querySelectorAll('#result tr'), (row) => {
            return Array.from(row.cells, (cell) => cell.textContent);
        });
    }

    function select(doc, win, selector, value) {
        const element = doc.querySelector(selector);
        element.value = value;
        element.dispatchEvent(new win.Event('change', { bubbles: true }));
    }

    function expectRows(doc, rows) {
        const actual = tableRows(doc);
        expect(JSON.stringify(actual) === JSON.stringify(rows),
            `表の内容が期待値に一致する（実際: ${JSON.stringify(actual)}）`);
    }

    async function scenario(id, check) {
        const frame = await openViewer();
        try {
            await check(frame.contentDocument, frame.contentWindow);
            results[id] = '成功';
        } catch (error) {
            results[id] = error.message;
        } finally {
            frame.remove();
        }
    }

    await scenario('initial', (doc) => {
        const file = doc?.querySelector('#csv-file');
        expect(file?.type === 'file' && !file.disabled, 'ファイル入力が有効になる');
        expect(doc.querySelector('#group-column')?.matches(':disabled'), 'グループ化列は読み込みまで無効になる');
        expect(doc.querySelector('#aggregate-column')?.matches(':disabled'), '集計列は読み込みまで無効になる');
        expect(doc.querySelector('script[type=module][src="./app.js"]'), 'app.js を ES モジュールで読み込む');
    });

    await scenario('columns', async (doc, win) => {
        await loadCsv(doc, win, 'genre,minutes\nanime,5\n');
        for (const selector of ['#group-column', '#aggregate-column']) {
            const labels = Array.from(doc.querySelector(selector).options).slice(1);
            expect(labels.map((option) => option.textContent).join(',') === 'genre,minutes',
                'ヘッダーの順序で両方の列を選べる');
        }
    });

    await scenario('render', async (doc, win) => {
        await loadCsv(doc, win, 'genre,minutes,active\nanime,1e3,true\nnews,,false\n');
        expect(!doc.querySelector('#result').hidden, '結果の表が表示される');
        expectRows(doc, [['genre', 'minutes', 'active'], ['anime', '1000', 'true'], ['news', '', 'false']]);
    });

    await scenario('groups', async (doc, win) => {
        const csv = 'genre,minutes\nanime,3\nnews,2\nanime,3\n';
        await loadCsv(doc, win, csv);
        const table = doc.querySelector('#result');
        select(doc, win, '#group-column', '0');
        expectRows(doc, [['genre'], ['anime'], ['news']]);
        select(doc, win, '#group-column', '1');
        expectRows(doc, [['minutes'], ['3'], ['2']]);
        select(doc, win, '#group-column', '');
        expectRows(doc, [['genre', 'minutes'], ['anime', '3'], ['news', '2'], ['anime', '3']]);
        expect(doc.querySelector('#result') === table && doc.defaultView === win, '同じページと表を使う');
    });

    await scenario('aggregates', async (doc, win) => {
        const csv = 'genre,minutes,score\nanime,8,30\nnews,5,4\nanime,2,10\n';
        await loadCsv(doc, win, csv);
        select(doc, win, '#group-column', '0');
        select(doc, win, '#aggregate-column', '1');
        for (const [operation, anime, news] of [['sum', '10', '5'], ['avg', '5', '5'],
            ['min', '2', '5'], ['max', '8', '5'], ['count', '2', '1']]) {
            select(doc, win, '#operation', operation);
            const label = operation === 'count' ? 'count' : operation + '_minutes';
            expectRows(doc, [['genre', label], ['anime', anime], ['news', news]]);
        }
        select(doc, win, '#operation', 'sum');
        select(doc, win, '#aggregate-column', '2');
        expectRows(doc, [['genre', 'sum_score'], ['anime', '40'], ['news', '4']]);
    });

    await scenario('sort', async (doc, win) => {
        await loadCsv(doc, win, 'genre,minutes\nanime,10\nnews,2\ndrama,5\n');
        const table = doc.querySelector('#result');
        let header = table.tHead.rows[0].cells[1];
        header.click();
        expectRows(doc, [['genre', 'minutes'], ['news', '2'], ['drama', '5'], ['anime', '10']]);
        header = table.tHead.rows[0].cells[1];
        expect(header.getAttribute('aria-sort') === 'ascending', '見出しに昇順が示される');
        const clone = header.cloneNode(true);
        header.replaceWith(clone);
        clone.querySelector('button').click();
        expectRows(doc, [['genre', 'minutes'], ['anime', '10'], ['drama', '5'], ['news', '2']]);
        expect(table.tHead.rows[0].cells[1].getAttribute('aria-sort') === 'descending', '見出しに降順が示される');
        table.tHead.rows[0].cells[0].querySelector('button').click();
        expectRows(doc, [['genre', 'minutes'], ['anime', '10'], ['drama', '5'], ['news', '2']]);
        expect(table.tHead.rows[0].cells[0].getAttribute('aria-sort') === 'ascending', '別の列は昇順から始める');
    });

    await scenario('text', async (doc, win) => {
        await loadCsv(doc, win, '<b>見出し</b>\n<img src=x>\n');
        expectRows(doc, [['<b>見出し</b>'], ['<img src=x>']]);
        expect(!doc.querySelector('#result b, #result img'), '表の文字列が DOM 要素に変換されない');
        expect(doc.querySelector('#group-column').options[1].textContent === '<b>見出し</b>',
            '選択肢でも元の文字列が保たれる');
    });

    document.querySelector('#results').textContent = encodeURIComponent(JSON.stringify(results));
</script>
</html>
